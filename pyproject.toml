# Relay (src/relay, launched with ./relay) and opencode-manager (src/opencode_manager,
# ./opencode-manager), which Relay builds on, run from this portable folder; they're not
# meant to be pip-installed. This file holds project metadata and tool configuration.
[project]
name = "relay"
version = "4.2.0"
description = "Self-hosted chat and coding agents, with opencode-manager's profiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["textual>=8.2", "starlette>=1.7", "uvicorn>=0.54", "wsproto>=1.3", "pypdf>=6.19"]

[project.optional-dependencies]
dev = ["pytest<9.2", "pytest-xdist", "httpx2", "ruff", "playwright"]  # (requirements-dev.lock pins them)

[tool.pytest.ini_options]
pythonpath = ["src", "vendor", "vendor-dev"]
testpaths = ["tests", "src/relay/providers"]  # (each provider folder's tests too: providers/<name>/tests)
# (by their path: a provider folder's test_opencode.py and tests/opencode_manager's are two files, not one name)
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
src = ["src", "sdk/python", "."]
extend-exclude = ["vendor", "vendor-dev"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "C4", "PIE", "BLE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# (a script template starts with `from relay_sdk import *`, as the scripts it seeds do)
"src/relay/builtin_skills/relay-sdk-template-writer/templates/*" = ["F403", "F405"]
# (these run on the user's own computers and in boxes, on whatever Python is there: 3.8 and up)
"src/relay/connector.py" = ["UP"]
"src/relay/tools_script.py" = ["UP"]
"plugins/acp/static/relay-acp.py" = ["UP"]
# (a test's data reads best on one line)
"tests/*" = ["E501"]
"conftest.py" = ["E501"]
"src/relay/providers/*/tests/*" = ["E501"]
